name: Sync upstream with local commits

on:
  schedule:
    - cron: '0 17,23,5,11 * * *'  # 北京时间1点开始每6小时执行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 拉取完整历史记录
          token: ${{ secrets.UPSTREAM_TOKEN }}
          persist-credentials: true

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Sync upstream
        run: |

          if [ "$(date -u +%u)" -eq 4 ] && [ "$(date -u +%H)" -ge 4 ] && [ "$(date -u +%H)" -lt 10 ]; then
            git push -f origin master:backup
          fi

          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git # 替换为上游仓库地址
          git fetch upstream # 拉取上游最新的提交

          git rebase upstream/master
          git push -f origin master